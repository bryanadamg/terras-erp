name: Tests

# main is covered by deploy.yml, which calls this workflow and deploys only when
# it passes — main takes local merges, never PRs, so pull_request alone meant
# nothing ever tested what shipped.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://erp:erp@localhost:5432/erp
      REDIS_URL: redis://localhost:6379/0
      # Throwaway, CI-only: the app refuses to start without a signing key.
      SECRET_KEY: ci-test-signing-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: python -u -m pytest tests -v -n auto

  migrations:
    # Fresh installs are built from the models (app/db/bootstrap.py) — the
    # migration chain cannot replay from empty. What deploy actually runs is
    # "last release's schema + this branch's new revisions", so test exactly that:
    # bootstrap at the base ref, then upgrade with this checkout, then require the
    # result to match the models and the chain to have one head.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://erp:erp@localhost:5432/erp
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-signing-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Single alembic head
        working-directory: backend
        run: test "$(alembic heads | wc -l)" -eq 1 || { alembic heads; exit 1; }

      - name: Build the base schema
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # main deploys diff against the previous main tip; dev and PRs against main.
          if [ "$GITHUB_REF_NAME" = main ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            BASE="$BEFORE"
          elif [ -n "$GITHUB_BASE_REF" ]; then
            BASE="origin/$GITHUB_BASE_REF"
          else
            BASE=origin/main
          fi
          echo "Base: $BASE"
          git worktree add ../base "$BASE"
          cd ../base/backend
          python -m app.db.bootstrap
          alembic stamp head

      - name: Upgrade to this revision and compare with the models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    env:
      # @bryanadamg/terras-ui comes from GitHub Packages (see frontend/.npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        # Errors fail the job; the exhaustive-deps backlog is warnings for now.
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
