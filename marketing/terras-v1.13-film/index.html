<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Workspace ground","default":"#ece9d8"},
    {"id":"color-blue","type":"color","label":"XP blue","default":"#0058e6"},
    {"id":"color-accent","type":"color","label":"Accent (green)","default":"#2d7a2d"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#1a1a1a"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/floor.js"></script>
    <style>
      @font-face { font-family: "XP"; src: local("Tahoma"); font-weight: 400; }
      @font-face { font-family: "XP"; src: local("Tahoma Bold"), local("Tahoma-Bold"); font-weight: 700; }
      :root {
        --color-ground: #ece9d8;
        --color-blue: #0058e6;
        --color-accent: #2d7a2d;
        --color-ink: #1a1a1a;
        --font-display: "XP";
        --font-code: Consolas, "Courier New", monospace;
        --title-bar: linear-gradient(to right, #0058e6 0%, #08a5ff 100%);
        --table-head: linear-gradient(to bottom, #ffffff 0%, #d6d3ce 100%);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--color-ground); font-family: var(--font-display); color: var(--color-ink);
      }
      #root { width: 100%; height: 100%; position: relative; }
      #ground { position: absolute; inset: 0; background: var(--color-ground); }

      /* Shared XP chrome, rebuilt from terras-ui tokens at ~2.2x the app's 11 px scale. */
      .xp-win { position: absolute; background: #fff; border: 2px solid #0831d9; border-radius: 12px 12px 4px 4px; box-shadow: 0 18px 40px rgba(0,0,40,0.28); overflow: hidden; }
      .xp-title { height: 56px; background: var(--title-bar); color: #fff; font-weight: 700; font-size: 28px; display: flex; align-items: center; gap: 14px; padding: 0 20px; text-shadow: 1px 1px 0 rgba(0,0,0,0.35); }
      .xp-title img { width: 34px; height: 34px; }
      .xp-body { background: var(--color-ground); }
      .xp-th { background: var(--table-head); border-bottom: 2px solid #aca899; font-weight: 700; font-size: 28px; color: #222; }
      .xp-field { background: #fff; border: 2px solid #7f9db9; border-radius: 3px; height: 62px; font-size: 30px; display: flex; align-items: center; padding: 0 16px; }
      .xp-btn { height: 66px; border-radius: 3px; border: 2px solid #003c74; background: linear-gradient(to bottom, #ffffff, #ece9d8); color: #1a1a1a; font-weight: 700; font-size: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0 26px; }
      .xp-btn.go { border-color: #0a4a0a; background: linear-gradient(to bottom, #5ec85e, #2d7a2d); color: #fff; }
      .chip { display: inline-flex; align-items: center; gap: 8px; border: 2px solid; border-radius: 3px; font-weight: 700; font-size: 28px; padding: 2px 12px; white-space: nowrap; line-height: 1.3; }
      .c-blue { background: #dce4f5; border-color: #3a5faa; color: #0d2a6e; }
      .c-amber { background: #fff3cd; border-color: #b8860b; color: #5d3800; }
      .c-green { background: #d4edda; border-color: #27713a; color: #0c3a1a; }
      .c-gray { background: #e8e8e8; border-color: #7a7a7a; color: #222; }
      .c-red { background: #fde2e1; border-color: #b3261e; color: #5c0d08; }
      .code { font-family: var(--font-code); font-weight: 700; }
      .title-line { font-weight: 700; font-size: 96px; letter-spacing: -0.01em; line-height: 1.1; }
      .w { display: inline-block; }
      /* The station caption: the hour, then what happened. */
      .hour { font-weight: 700; font-size: 120px; letter-spacing: -0.02em; line-height: 1; color: var(--color-blue); }
      .hour-line { font-weight: 700; font-size: 52px; line-height: 1.15; color: var(--color-ink); }
      .cursor { position: absolute; left: 0; top: 0; width: 72px; height: 72px; z-index: 20; }
      /* The app's Bootstrap icons, tinted by currentColor. */
      .ic { display: inline-block; width: 30px; height: 30px; flex: none; background: currentColor; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
      .paper { position: absolute; background: #fff; border: 2px solid #000; box-shadow: 0 18px 40px rgba(0,0,40,0.22); color: #000; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <div id="ground"></div>

      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01-dawn.html" data-start="0" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02-receive.html" data-start="3.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03-beams.html" data-start="8" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s04" data-composition-id="s04" data-composition-src="compositions/s04-tuning.html" data-start="12" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s05" data-composition-id="s05" data-composition-src="compositions/s05-log.html" data-start="15.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s06" data-composition-id="s06" data-composition-src="compositions/s06-pick.html" data-start="20" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s07" data-composition-id="s07" data-composition-src="compositions/s07-deck.html" data-start="23.5" data-duration="4.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s08" data-composition-id="s08" data-composition-src="compositions/s08-export.html" data-start="28.2" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s09" data-composition-id="s09" data-composition-src="compositions/s09-claim.html" data-start="31.7" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s10" data-composition-id="s10" data-composition-src="compositions/s10-endcard.html" data-start="35.7" data-duration="4.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
