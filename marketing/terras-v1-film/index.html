      @font-face { font-family: "XP"; src: local("Tahoma Bold"), local("Tahoma-Bold"); font-weight: 700; }
      :root {
        --color-ground: #ece9d8;
        --color-blue: #0058e6;
        --color-accent: #2d7a2d;
        --color-ink: #1a1a1a;
        --font-display: "XP";
        --font-code: Consolas, "Courier New", monospace;
        --title-bar: linear-gradient(to right, #0058e6 0%, #08a5ff 100%);
        --table-head: linear-gradient(to bottom, #ffffff 0%, #d6d3ce 100%);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        font-family: var(--font-display);
        color: var(--color-ink);
      }
      #root { width: 100%; height: 100%; position: relative; }
      #ground { position: absolute; inset: 0; background: var(--color-ground); }

      /* Shared XP chrome, rebuilt from terras-ui tokens at ~2.2x the app's 11 px scale. */
      .xp-win { position: absolute; background: #fff; border: 2px solid #0831d9; border-radius: 12px 12px 4px 4px; box-shadow: 0 18px 40px rgba(0,0,40,0.28); overflow: hidden; }
      .xp-title { height: 56px; background: var(--title-bar); color: #fff; font-weight: 700; font-size: 28px; display: flex; align-items: center; gap: 14px; padding: 0 20px; text-shadow: 1px 1px 0 rgba(0,0,0,0.35); }
      .xp-title img { width: 34px; height: 34px; }
      .xp-body { background: var(--color-ground); }
      .xp-th { background: var(--table-head); border-bottom: 2px solid #aca899; font-weight: 700; font-size: 28px; color: #222; }
      .chip { display: inline-flex; align-items: center; gap: 8px; border: 2px solid; border-radius: 3px; font-weight: 700; font-size: 28px; padding: 2px 12px; white-space: nowrap; line-height: 1.3; }
      .c-blue { background: #dce4f5; border-color: #3a5faa; color: #0d2a6e; }
      .c-amber { background: #fff3cd; border-color: #b8860b; color: #5d3800; }
      .c-green { background: #d4edda; border-color: #27713a; color: #0c3a1a; }
      .c-gray { background: #e8e8e8; border-color: #7a7a7a; color: #222; }
      .c-pink { background: #fde4ef; border-color: #b0477a; color: #5a1035; }
      .c-slate { background: #e6e9f0; border-color: #4a5a78; color: #1c2840; }
      .code { font-family: var(--font-code); font-weight: 700; }
      .title-line { font-weight: 700; font-size: 96px; letter-spacing: -0.01em; line-height: 1.1; }
      .title-line .w { display: inline-block; }
    </style>
